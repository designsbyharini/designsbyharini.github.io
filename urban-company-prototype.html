 { name: 'Bathroom Deep Cleaning', desc: 'Deep cleaning and descaling of bathrooms', price: 1699, hrs: '2\u20133 hrs', pros: '1 professional', d: IC.bath }\n];\nconst QS = [\n  { id: 'home', title: 'What type of home is it?', help: 'Helps us understand the size', d: IC.home, opts: ['1 BHK', '2 BHK', '3 BHK+'] },\n  { id: 'furn', title: 'What\u2019s the furnishing status?', help: 'So we can plan the right approach', d: IC.sofa, opts: ['Furnished', 'Semi-furnished', 'Unfurnished'] },\n  { id: 'type', title: 'What type of cleaning do you need?', help: 'Helps us plan the right service and time', d: IC.broom, opts: ['Regular cleaning', 'Deep cleaning'] },\n  { id: 'when', title: 'When do you need the cleaning?', help: 'Helps us schedule the right professional', d: IC.cal, opts: ['Flexible', 'In 2\u20133 days', 'Tomorrow'] }\n];\nconst DEF_ANS = { home: '2 BHK', furn: 'Furnished', type: 'Deep cleaning', when: 'Tomorrow' };\nconst rupee = n => '\u20b9' + n.toLocaleString('en-IN');\n\nclass Component extends DCLogic {\n  state = this.init(this.props || {});\n\n  init(p) {\n    const path = p.path === 'negative' ? 'negative' : 'happy';\n    const fixed = !!p.screen;\n    const screen = p.screen || 'describe';\n    return {\n      screen,\n      route: path === 'negative' ? 'vague' : 'detailed',\n      text: fixed ? (path === 'negative' ? V_SAMPLE : D_SAMPLE) : '',\n      answers: fixed && path === 'negative' && screen !== 'describe' ? { ...DEF_ANS } : {},\n      pkg: 0, qty: 1, done: false, tab: fixed ? path : null\n    };\n  }\n\n  parse(t) {\n    const s = t.toLowerCase();\n    const bhk = s.match(/(\\d)\\s*-?\\s*bhk/);\n    return {\n      home: bhk ? bhk[1] + ' BHK' : '2 BHK',\n      furn: /unfurnished/.test(s) ? 'Unfurnished' : /semi/.test(s) ? 'Semi-furnished' : 'Furnished',\n      status: /empty|vacant|moving/.test(s) ? 'Empty home' : 'Occupied home',\n      type: /deep|greasy|dirty/.test(s) ? 'Deep cleaning' : 'Regular cleaning',\n      last: /week/.test(s) ? 'A few weeks ago' : '6+ months ago',\n      areas: [/kitchen/.test(s) && 'Kitchen', /bath/.test(s) && 'Bathroom'].filter(Boolean).join(', ') || 'Whole home',\n      when: /tomorrow/.test(s) ? 'Tomorrow' : 'Flexible'\n    };\n  }\n\n  go(screen) { this.setState({ screen, done: false }); }\n\n  renderVals() {\n    const st = this.state;\n    const detailed = st.route === 'detailed';\n    const info = detailed ? this.parse(st.text) : {\n      home: st.answers.home, furn: st.answers.furn, type: st.answers.type, when: st.answers.when,\n      status: 'Occupied home', last: '\u2014', areas: 'Whole home'\n    };\n    const isDeep = (info.type || '') === 'Deep cleaning';\n    const bestIdx = isDeep ? (/kitchen/i.test(st.text) && !/bath/i.test(st.text) ? 1 : 0) : 2;\n    const best = PKGS[bestIdx];\n    const why = isDeep\n      ? (detailed ? 'Ideal for homes not cleaned in 6+ months. Covers all rooms, kitchen and bathrooms.' : `Fits a ${info.home} ${String(info.furn).toLowerCase()} home that needs a deep clean.`)\n      : `Fits a ${info.home} home that is cleaned regularly.`;\n    const answered = QS.filter(q => st.answers[q.id]).length;\n    const allAnswered = answered === QS.length;\n    const cartPkg = PKGS[st.pkg];\n    const onFind = () => {\n      const t = st.text.trim();\n      if (!t) return;\n      const rich = t.length >= 45;\n      this.setState({ route: rich ? 'detailed' : 'vague', screen: rich ? 'understood' : 'questions', answers: rich ? {} : st.answers });\n    };\n    const backMap = { understood: 'describe', questions: 'describe', confirm: 'questions', recommend: detailed ? 'understood' : 'confirm', cart: 'recommend' };\n    const labels = { describe: 'Describe', understood: 'Here\u2019s what we understood', questions: 'Quick questions', confirm: 'Confirm needs', recommend: 'Recommendations', cart: 'Cart' };\n    const flow = detailed ? ['describe', 'understood', 'recommend', 'cart'] : ['describe', 'questions', 'confirm', 'recommend', 'cart'];\n    const stepIdx = Math.max(0, flow.indexOf(st.screen));\n    const tabOn = { bg: '#141414', fg: '#FFFFFF' }, tabOff = { bg: 'transparent', fg: '#45453F' };\n    const rows = (arr) => arr.map((r, i) => ({ ...r, border: i === arr.length - 1 ? '0' : '1px solid #F0EFF5' }));\n\n    return {\n      controls: this.props.controls !== false && !this.props.screen,\n      pad: this.props.screen ? '0' : '24px 12px',\n      tabA: st.tab === 'happy' ? tabOn : tabOff,\n      tabB: st.tab === 'negative' ? tabOn : tabOff,\n      stepLabel: `Step ${stepIdx + 1} of ${flow.length} \u00b7 ${labels[st.screen]}`,\n      tryDetailed: () => this.setState({ ...this.init({}), tab: 'happy', text: D_SAMPLE }),\n      tryVague: () => this.setState({ ...this.init({}), tab: 'negative', text: V_SAMPLE }),\n      restart: () => this.setState({ ...this.init({}) }),\n      isDescribe: st.screen === 'describe', isUnderstood: st.screen === 'understood', isQuestions: st.screen === 'questions',\n      isConfirm: st.screen === 'confirm', isRecommend: st.screen === 'recommend', isCart: st.screen === 'cart',\n      text: st.text, count: st.text.length,\n      inputBorder: st.text ? '#8C77FA' : '#E4E2EE',\n      findOpacity: st.text.trim() ? 1 : 0.45,\n      onText: e => this.setState({ text: e.target.value.slice(0, 300) }),\n      find: onFind,\n      back: () => backMap[st.screen] && this.go(backMap[st.screen]),\n      editDesc: () => this.go('describe'),\n      toRecommend: () => this.go('recommend'),\n      toConfirm: () => allAnswered && this.go('confirm'),\n      tiles: [\n        { label: 'Bathroom Cleaning', d: IC.bath }, { label: 'Kitchen Cleaning', d: IC.pot }, { label: 'Living & Bedroom', d: IC.sofa }, { label: 'Full Home / By Room', d: IC.grid },\n        { label: 'Office Cleaning', d: IC.bldg }, { label: 'Balcony Cleaning', d: IC.balc }, { label: 'Window Cleaning', d: IC.win }, { label: 'Other Request', d: IC.dots }\n      ],\n      facts: rows([\n        { label: 'Home type', value: info.home, d: IC.home }, { label: 'Furnishing', value: info.furn, d: IC.sofa },\n        { label: 'Home status', value: info.status, d: IC.people }, { label: 'Cleaning type', value: info.type + ' needed', d: IC.broom },\n        { label: 'Last cleaned', value: info.last, d: IC.cal }\n      ]),\n      answeredLabel: `Answer a few to get better recommendations \u00b7 ${answered}/${QS.length}`,\n      questions: QS.map(q => ({\n        ...q,\n        opts: q.opts.map(o => {\n          const on = st.answers[q.id] === o;\n          return { label: o, bg: on ? '#5A3FF0' : '#FFFFFF', fg: on ? '#FFFFFF' : '#5A3FF0', bd: on ? '#5A3FF0' : '#D9D3FF',\n            pick: () => this.setState(s => ({ answers: { ...s.answers, [q.id]: o } })) };\n        })\n      })),\n      qBtn: allAnswered ? { bg: 'linear-gradient(90deg,#6C50F7,#4E33E6)', fg: '#FFFFFF' } : { bg: '#ECEBF3', fg: '#A3A3B0' },\n      requestText: detailed ? st.text : `\u201c${st.text}\u201d \u00b7 ${info.home || '\u2014'}, ${String(info.furn || '\u2014').toLowerCase()}, ${String(info.type || '\u2014').toLowerCase()}, ${String(info.when || '\u2014').toLowerCase()}.`,\n      confirmRows: rows([\n        { label: 'Home type', value: info.home || '\u2014', d: IC.home }, { label: 'Furnishing', value: info.furn || '\u2014', d: IC.sofa },\n        { label: 'Cleaning type', value: info.type || '\u2014', d: IC.broom }, { label: 'When', value: info.when || '\u2014', d: IC.cal }\n      ]),\n      sumA: `${info.home} \u00b7 ${info.furn} \u00b7 ${info.status}`,\n      sumB: detailed ? `${info.type} \u00b7 Last cleaned ${info.last}` : `${info.type} \u00b7 ${info.when}`,\n      best: { ...best, priceLabel: rupee(best.price), why },\n      addBest: () => this.setState({ pkg: bestIdx, qty: 1, screen: 'cart' }),\n      others: PKGS.map((p, i) => ({ ...p, i })).filter(p => p.i !== bestIdx).map(p => ({ ...p, priceLabel: rupee(p.price), add: () => this.setState({ pkg: p.i, qty: 1, screen: 'cart' }) })),\n      cart: { ...cartPkg, lineLabel: rupee(cartPkg.price * st.qty) },\n      qty: st.qty,\n      inc: () => this.setState(s => ({ qty: Math.min(5, s.qty + 1) })),\n      dec: () => this.setState(s => ({ qty: Math.max(1, s.qty - 1) })),\n      gets: st.pkg === 3 ? ['Deep cleaning of all bathrooms', 'Descaling of tiles and fittings', 'Professional equipment and supplies'] : ['Complete cleaning of all areas mentioned', 'Professional equipment and supplies', 'Service guarantee'],\n      nots: ['Refrigerator cleaning', 'Cabinets (inside)', 'Wall cleaning'],\n      coLabel: st.done ? 'Booked \u00b7 end of prototype' : 'Proceed to checkout',\n      coBg: st.done ? '#1F9D55' : 'linear-gradient(90deg,#6C50F7,#4E33E6)',\n      checkout: () => this.setState({ done: true })\n    };\n  }\n}\n<\/script>\n\n<div style=\"background:#111;color:#fff;text-align:center;padding:22px 16px;font:500 15px/1.4 system-ui,-apple-system,sans-serif\"><a href=\"index.html\" style=\"color:#fff;text-decoration:underline;text-underline-offset:3px\">\u2190 Back to Harini's portfolio<\/a><\/div>\n<\/body>\n<\/html>\n"],{type:"text/html"});</script>
