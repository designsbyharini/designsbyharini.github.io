font-weight:600\">Show failures<\/span><span style=\"font-size:13px;line-height:1.4;color:#a9a9a3\">Each check fails once, then offers a retry or an agent.<\/span><\/div>\n      <div style=\"width:46px;height:28px;flex-shrink:0;border-radius:999px;background:{{ swBg }};display:flex;justify-content:{{ swJ }};padding:3px;box-sizing:border-box\"><span style=\"width:22px;height:22px;border-radius:50%;background:#0a0a0a\"><\/span><\/div>\n    <\/div>\n    <div style=\"display:flex;flex-direction:column;gap:6px;padding-top:4px;border-top:1px solid #2a2a2a\">\n      <span style=\"font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#8a8a84;padding-top:16px\">Now showing<\/span>\n      <span style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:24px;font-weight:700;letter-spacing:-.02em\">{{ cur }}<\/span>\n      <span style=\"font-size:14px;color:#a9a9a3\">{{ routeLabel }} \u00b7 {{ stepCount }}<\/span>\n    <\/div>\n    <div onClick=\"{{ restart }}\" style=\"cursor:pointer;align-self:flex-start;padding:12px 20px;border-radius:999px;background:#d4ff3a;color:#0a0a0a;font-size:15px;font-weight:700\">Restart<\/div>\n  <\/div>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script>\nconst __R = (k, p) => (window.__resources && window.__resources[k]) || p;\nclass Component extends DCLogic {\n  state = { photo: 0, lang: 'Kiswahili', cur: 'Choose ID', hist: [], id: 'NIDA card or number', method: 'Fingerprint', acct: 'Savvr Everyday', fail: false, used: {} };\n  timer = null;\n  last = null;\n  componentDidMount() { this.last = this.state.cur; this.auto(); }\n  componentDidUpdate() { if (this.last !== this.state.cur) { this.last = this.state.cur; this.auto(); } }\n  componentWillUnmount() { clearTimeout(this.timer); }\n  auto() {\n    clearTimeout(this.timer);\n    const A = { 'Selfie \u00b7 Hold still': 1, 'Checking NIDA': 1, 'Scanning': 1, 'Selfie 2/5 \u00b7 Live guidance': 1, 'Opening account': 1 };\n    if (A[this.state.cur]) this.timer = setTimeout(() => this.handle('auto'), 1700);\n  }\n  go(to) { if (to && to !== this.state.cur) this.setState(s => ({ cur: to, hist: [...s.hist, s.cur] })); }\n  handle(kind, val) {\n    const S = this.state, cur = S.cur;\n    if (kind === 'back') { if (S.hist.length) this.setState(s => ({ cur: s.hist[s.hist.length - 1], hist: s.hist.slice(0, -1) })); return; }\n    if (kind === 'tile') {\n      if (cur === 'Choose ID') this.setState({ id: val });\n      if (cur === 'Language') this.setState({ lang: val });\n      if (cur === 'Verify method') this.setState({ method: val });\n      if (cur === 'Choose account') this.setState({ acct: val });\n      return;\n    }\n    const F = (key, bad, ok) => { if (S.fail && !S.used[key]) { this.setState(s => ({ used: { ...s.used, [key]: 1 } })); return bad; } return ok; };\n    const nida = S.id === 'NIDA card or number', pass = S.id === 'Passport';\n    const sel1 = \"Selfie 1/5 \u00b7 Do's and don'ts\", sel2 = 'Selfie 2/5 \u00b7 Live guidance';\n    const fwd = kind === 'cta' || kind === 'body' || kind === 'auto' || kind === 'pick' || kind === 'yes';\n    const M = {\n      'Splash': () => 'Language',\n      'Language': () => fwd && 'Welcome',\n      'Welcome': () => kind === 'alt' ? 'Log in' : 'Before you start',\n      'Before you start': () => 'Phone number',\n      'Phone number': () => kind === 'cta' && 'SMS permission',\n      'SMS permission': () => (kind === 'yes' || kind === 'no') && 'SMS code',\n      'SMS code': () => fwd && F('sms', 'Wrong code', 'Choose ID'),\n      'Wrong code': () => kind === 'alt' ? 'Code expired' : 'Choose ID',\n      'Code expired': () => 'SMS code',\n      'Number not found': () => kind === 'alt' ? 'Choose ID' : 'Checking NIDA',\n      'NIDA record found': () => fwd && 'Verify method',\n      'Fingerprint matched': () => fwd && 'Camera permission',\n      'Answers matched': () => fwd && 'Camera permission',\n      'Selfie \u00b7 Hold still': () => 'Selfie 4/5 \u00b7 Review photo',\n
